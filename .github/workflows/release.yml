name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Stable Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload APK and Changelog to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK_PATH=$(find app/build/outputs/apk/universalGms/debug -name '*.apk' | head -n 1)
          mv "$APK_PATH" "convx-${TAG}.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "convx-${TAG}.apk" changelog.json --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "convx-${TAG}.apk" changelog.json --repo "${{ github.repository }}" --title "Convx ${TAG}" --notes-file changelog.json
          fi
