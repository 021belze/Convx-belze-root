name: Beta GMS Build

on:
  push:
    branches: [ 'beta' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_beta:
    name: Build Universal GMS Beta
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal GMS Beta APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew assembleUniversalGmsDebug -Pnightly=true -PnightlyRun=${{ github.run_number }} --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload Beta Artifact
        uses: actions/upload-artifact@v4
        with:
          name: convx-gms-beta
          path: app/build/outputs/apk/universalGms/debug/*.apk

      - name: Publish Beta Pre-Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_MAJOR=$(grep "VERSION_MAJOR=" version.properties | cut -d'=' -f2 | tr -d '\r\n ')
          VERSION_MINOR=$(grep "VERSION_MINOR=" version.properties | cut -d'=' -f2 | tr -d '\r\n ')
          VERSION_PATCH=$(grep "VERSION_PATCH=" version.properties | cut -d'=' -f2 | tr -d '\r\n ')
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          TAG="v${VERSION}-beta-r${{ github.run_number }}"
          
          APK_SRC=$(find app/build/outputs/apk/universalGms/debug -name '*.apk' | head -n 1)
          if [ -n "$APK_SRC" ] && [ -f "$APK_SRC" ]; then
            APK_DEST="convx-v${VERSION}-universal-beta-r${{ github.run_number }}.apk"
            cp "$APK_SRC" "$APK_DEST"

            TITLE="Convx v${VERSION} Beta (r${{ github.run_number }})"
            NOTES="Automated high-speed Beta pre-release build from branch beta (run #${{ github.run_number }})."
            
            gh release create "$TAG" "$APK_DEST" changelog.json \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          else
            echo "Error: APK not found in app/build/outputs/apk/universalGms/debug"
            exit 1
          fi

